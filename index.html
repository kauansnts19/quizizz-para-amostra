<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quiz de Desenvolvimento de Sistemas</title>
  <!-- Fonte retrô (opcional: sem internet, usa a fonte monoespaçada padrão) -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="sun"></div>
  <div class="grid"></div>

  <main class="cabinet">

    <!-- TELA INICIAL -->
    <section id="tela-inicio" class="tela ativa">
      <h1 class="logo">QUIZ DE<br>DESENVOLVIMENTO<br>DE SISTEMAS</h1>
      <p class="sub">Teste seus conhecimentos sobre tecnologia!</p>
      <label for="nome" class="label">DIGITE SEU NOME</label>
      <input id="nome" type="text" maxlength="14" placeholder="PLAYER 1" autocomplete="off">
      <button id="btn-comecar" class="btn btn-rosa">COMEÇAR QUIZ</button>
      <p class="coin">INSERT COIN ▮ 10 FASES</p>
    </section>

    <!-- TELA DO QUIZ -->
    <section id="tela-quiz" class="tela">
      <div class="hud">
        <span id="hud-nome">PLAYER 1</span>
        <span id="hud-fase">FASE 1/10</span>
        <span id="hud-pontos">SCORE 0</span>
      </div>
      <div class="barra"><div id="barra-prog"></div></div>
      <p id="tipo" class="tipo"></p>
      <h2 id="pergunta" class="pergunta"></h2>
      <div id="opcoes" class="opcoes"></div>
      <p id="feedback" class="feedback" aria-live="polite"></p>
      <button id="btn-proxima" class="btn btn-ciano" hidden>PRÓXIMA PERGUNTA</button>
    </section>

    <!-- TELA DE RESULTADOS -->
    <section id="tela-final" class="tela">
      <p class="tipo">GAME OVER</p>
      <h2 id="res-nome" class="logo pequeno"></h2>
      <p class="placar"><span id="res-acertos">0</span>/<span id="res-total">10</span> ACERTOS</p>
      <p class="aprov"><span id="res-pct">0</span>% DE APROVEITAMENTO</p>
      <p id="res-msg" class="msg"></p>
      <button id="btn-reiniciar" class="btn btn-amarelo">JOGAR NOVAMENTE</button>
    </section>

  </main>

  <div id="confete"></div>
  <script src="script.js"></script>
</body>
</html>
